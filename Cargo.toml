[package]
name = "weeb_3"
version = "0.0.0"
edition = "2024"
description = "Standalone Swarm HLS viewer (native port of weeb-3)"
license = "MIT"

[[bin]]
name = "weeb-3-rs-hls"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
prost-build = "0.14.4"

[dependencies]
alloy-primitives = { git = "https://github.com/alloy-rs/core.git", default-features = false, features = ["std", "k256"] }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
async-std = { git = "https://github.com/async-rs/async-std.git" }
async-lock = "3.4.2"
bytes = "1.12"
event-listener = "5.4.1"
futures = "0.3.33"
libp2p = { git = "https://github.com/libp2p/rust-libp2p.git", features = [
    "ecdsa",
    "identify",
    "macros",
    "noise",
    "ping",
    "yamux",
    "tcp",
    "dns",
    "websocket",
    "tokio",
] }
libp2p-stream = { git = "https://github.com/libp2p/rust-libp2p.git" }
prost = "0.14.4"
rand = "0.8"
serde_json = "1"
hex = "0.4.3"
base64 = "0.22.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
tar = { git = "https://github.com/alexcrichton/tar-rs.git" }
mime_guess = { git = "https://github.com/abonander/mime_guess.git", default-features = false }
percent-encoding = "2"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
anyhow = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
